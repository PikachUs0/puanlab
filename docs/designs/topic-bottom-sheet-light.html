 ["Plus Jakarta Sans"], "label-lg": ["Plus Jakarta Sans"], "display-lg": ["Plus Jakarta Sans"], "title-md": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "body-lg": ["Plus Jakarta Sans"], "numeric-metric": ["Plus Jakarta Sans"], "title-lg": ["Plus Jakarta Sans"], "body-md": ["Plus Jakarta Sans"] }, fontSize: { "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "500" }], "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "500" }], "display-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }], "title-md": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "600" }], "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.015em", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }], "numeric-metric": ["22px", { lineHeight: "28px", letterSpacing: "-0.02em", fontWeight: "600" }], "title-lg": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "500" }], "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "400" }] } } } }</script><style>@layer base{html,body{width:100%;margin:0;padding:0;min-height:100%;background-color:#faf9ff;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1.5rem);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><style>

    }

  </head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(15,27,52,0.04)] pt-safe"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-xs"><button aria-label="Geri Dön" class="w-11 h-11 flex items-center justify-center text-on-surface hover:text-primary-container transition-colors -ml-2 rounded-full" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-title-lg text-title-lg text-on-surface font-semibold truncate max-w-[210px]">Konu Detayı</h1></div><div class="flex items-center gap-space-xs"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full relative min-h-full">
<!-- Backdrop simulating the calm study syllabus screen underneath -->
<div aria-hidden="true" class="px-margin pt-space-md space-y-space-md opacity-40 select-none pointer-events-none aria-hidden">
<div class="p-space-md rounded-xl bg-surface-container-lowest shadow-sm space-y-space-xs">
<div class="h-4 w-28 bg-surface-container rounded"></div>
<div class="h-6 w-48 bg-surface-container-high rounded"></div>
</div>
<div class="p-space-md rounded-xl bg-surface-container-lowest shadow-sm space-y-space-xs">
<div class="h-4 w-24 bg-surface-container rounded"></div>
<div class="h-6 w-40 bg-surface-container-high rounded"></div>
</div>
</div>
<!-- Bottom Sheet Overlay / Container -->
<section aria-labelledby="topic-title" aria-modal="true" class="relative mt-auto w-full bg-surface-container-lowest rounded-t-[28px] shadow-2xl transition-all duration-300 flex flex-col pt-space-sm pb-space-lg" role="dialog">
<!-- Accessible Drag Handle / Pill -->
<div aria-hidden="true" class="w-full flex items-center justify-center py-space-xs">
<div class="w-10 h-1 rounded-full bg-outline-variant/60"></div>
</div>
<!-- Sheet Content -->
<div class="px-margin flex flex-col gap-space-lg pt-space-xs">
<!-- Header: Lesson, Topic & Quick Close -->
<div class="flex items-start justify-between gap-space-sm">
<div class="flex flex-col min-w-0">
<span class="font-label-sm text-label-sm text-secondary tracking-wide uppercase font-medium">
            Matematik · TYT
          </span>
<h2 class="font-title-lg text-title-lg text-on-surface font-semibold tracking-tight truncate mt-0.5" id="topic-title">
            Fonksiyonlar
          </h2>
<!-- Current Status Pill (Calm, Informative) -->
<div class="inline-flex items-center gap-1.5 mt-2 self-start px-2.5 py-1 rounded-full bg-secondary-container text-on-secondary-container font-label-sm text-label-sm">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span>Mevcut Durum: <strong class="font-semibold" id="current-status-badge">Öğreniyorum</strong></span>
</div>
</div>
<!-- Close / Dismiss Action -->
<button aria-label="Kapat" class="w-10 h-10 -mr-2 rounded-full flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container transition-colors" onclick="history.back()" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Status Selector: Exactly the 5 permitted MVP states -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant font-medium">
          Çalışma Durumu
        </label>
<div aria-label="Konu Çalışma Durumu" class="grid grid-cols-3 gap-2" role="radiogroup">
<!-- Başlamadım -->
<button aria-checked="false" class="status-btn h-11 px-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm font-medium flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-status="Başlamadım" onclick="selectStatus(this, 'Başlamadım')" role="radio" type="button">
            Başlamadım
          </button>
<!-- Öğreniyorum (Active state) -->
<button aria-checked="true" class="status-btn h-11 px-2 rounded-xl bg-primary-container text-on-primary font-label-sm text-label-sm font-medium shadow-sm flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-status="Öğreniyorum" onclick="selectStatus(this, 'Öğreniyorum')" role="radio" type="button">
            Öğreniyorum
          </button>
<!-- Pratik -->
<button aria-checked="false" class="status-btn h-11 px-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm font-medium flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-status="Pratik" onclick="selectStatus(this, 'Pratik')" role="radio" type="button">
            Pratik
          </button>
<!-- Tekrar -->
<button aria-checked="false" class="status-btn h-11 px-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm font-medium flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-status="Tekrar" onclick="selectStatus(this, 'Tekrar')" role="radio" type="button">
            Tekrar
          </button>
<!-- Güçlü -->
<button aria-checked="false" class="status-btn h-11 px-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm font-medium flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]" data-status="Güçlü" onclick="selectStatus(this, 'Güçlü')" role="radio" type="button">
            Güçlü
          </button>
</div>
</div>
<!-- Personal Note Section -->
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-on-surface-variant font-medium" for="topic-note">
            Kişisel Not
          </label>
<span class="font-label-sm text-label-sm text-secondary opacity-0 transition-opacity duration-300" id="save-status">
            Kaydedildi
          </span>
</div>
<div class="relative">
<textarea class="w-full bg-surface-container-low rounded-xl p-space-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:bg-surface-container-high/60 transition-colors resize-none leading-relaxed" id="topic-note" oninput="triggerAutoSave()" placeholder="Bu konu hakkında özel notun..." rows="3">Tanım ve değer kümeleri ayrımında soru kaçabiliyor, bileşke fonksiyon kurallarını tekrar gözden geçir.</textarea>
</div>
</div>
<!-- Last Studied Info & Primary Action -->
<div class="flex flex-col gap-space-md pt-space-xs">
<!-- Clean Last Studied Date Display -->
<div class="flex items-center justify-between px-space-md py-space-sm bg-surface-container-low/70 rounded-xl">
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[18px] text-secondary">history</span>
<span class="font-label-sm text-label-sm font-medium">Son Çalışma</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface font-semibold" id="last-studied-text">
            3 gün önce · 14 Ekim
          </span>
</div>
<!-- Primary Action: Bugün Çalıştım -->
<button class="w-full h-12 rounded-xl bg-primary-container hover:bg-primary active:scale-[0.99] text-on-primary font-label-lg text-label-lg font-semibold flex items-center justify-center gap-2 shadow-sm transition-all duration-150" id="btn-studied-today" onclick="markStudiedToday()" type="button">
<span class="material-symbols-outlined text-[20px]" id="btn-icon">check_circle</span>
<span id="btn-label">Bugün Çalıştım</span>
</button>
</div>
</div>
</section>
</div>
<script>
  function selectStatus(btnElement, statusName) {
    const allButtons = document.querySelectorAll('.status-btn');
    allButtons.forEach(btn => {
      btn.setAttribute('aria-checked', 'false');
      btn.className = 'status-btn h-11 px-2 rounded-xl bg-surface-container-low text-on-surface-variant font-label-sm text-label-sm font-medium flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]';
    });

    btnElement.setAttribute('aria-checked', 'true');
    btnElement.className = 'status-btn h-11 px-2 rounded-xl bg-primary-container text-on-primary font-label-sm text-label-sm font-medium shadow-sm flex items-center justify-center text-center transition-all duration-150 active:scale-[0.98]';

    const currentBadge = document.getElementById('current-status-badge');
    if (currentBadge) {
      currentBadge.textContent = statusName;
    }
  }

  let saveTimeout;
  function triggerAutoSave() {
    const saveIndicator = document.getElementById('save-status');
    if (!saveIndicator) return;
    saveIndicator.classList.remove('opacity-0');
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      saveIndicator.classList.add('opacity-0');
    }, 1800);
  }

  function markStudiedToday() {
    const lastStudied = document.getElementById('last-studied-text');
    const btnLabel = document.getElementById('btn-label');
    const btnIcon = document.getElementById('btn-icon');
    const btn = document.getElementById('btn-studied-today');

    if (lastStudied) {
      lastStudied.textContent = 'Bugün';
    }

    if (btnLabel && btnIcon && btn) {
      btnLabel.textContent = 'Kaydedildi';
      btnIcon.textContent = 'done_all';
      btn.classList.add('bg-tertiary-container', 'text-on-tertiary');
      btn.classList.remove('bg-primary-container', 'text-on-primary');

      setTimeout(() => {
        btnLabel.textContent = 'Bugün Çalıştım';
        btnIcon.textContent = 'check_circle';
        btn.classList.remove('bg-tertiary-container', 'text-on-tertiary');
        btn.classList.add('bg-primary-container', 'text-on-primary');
      }, 2000);
    }
  }
</script></main></body></html>
